  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{--primary-font:'Space Grotesk',system-ui,-apple-system,sans-serif;--mono-font:'JetBrains Mono',monospace;--black:#000000;--white:#ffffff;--gray-100:#f8f9fa;--gray-200:#e9ecef;--gray-300:#dee2e6;--gray-400:#ced4da;--gray-600:#555555;--gray-700:#495057;--gray-800:#343a40;--gray-900:#212529;--accent:#007bff;--success:#28a745;--warning:#ffc107;--danger:#dc3545;--shadow:0 4px 20px rgba(0,0,0,0.1);--transition:all 0.3s cubic-bezier(0.4,0,0.2,1);--bg-gradient-1:#f8f9fa;--bg-gradient-2:#e3f2fd;--bg-gradient-3:#f3e5f5;}
    [data-theme="dark"]{--black:#ffffff;--white:#1a1a1a;--gray-100:#2a2a2a;--gray-200:#3a3a3a;--gray-300:#4a4a4a;--gray-400:#5a5a5a;--gray-600:#d0d0d0;--gray-700:#d0d0d0;--gray-800:#e0e0e0;--gray-900:#f0f0f0;--accent:#4da3ff;--success:#5fdb7f;--warning:#ffd54f;--danger:#ff6b6b;--shadow:0 4px 20px rgba(0,0,0,0.5);--bg-gradient-1:#1a1a2e;--bg-gradient-2:#16213e;--bg-gradient-3:#0f3460;}
    body{font-family:var(--primary-font);background:linear-gradient(135deg,var(--bg-gradient-1) 0%,var(--bg-gradient-2) 50%,var(--bg-gradient-3) 100%);background-size:400% 400%;animation:gradientShift 15s ease infinite;color:var(--black);overflow-x:hidden;line-height:1.6;font-weight:400;scroll-behavior:smooth;padding-top:2.5rem;}
    @keyframes gradientShift{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
    .container{max-width:1000px;margin:0 auto;padding:0 1.5rem;}
    .page-header{text-align:center;padding:3rem 0 2rem;}
    .page-header h2{font-size:clamp(1.8rem,4vw,2.5rem);margin-bottom:0.5rem;}
    .page-subtitle{color:var(--gray-600);font-size:1.05rem;}
    .project-card{background:var(--white);border:1px solid var(--gray-200);border-radius:12px;padding:1.5rem;box-shadow:var(--shadow);}
    .partner-layout{max-width:1000px;margin:0 auto;}
    .partner-hero{display:grid;grid-template-columns:180px 1fr;gap:2.5rem;align-items:center;margin-bottom:2rem;}
    .partner-hero img{width:180px;height:180px;object-fit:contain;border-radius:8px;}
    .section-kicker{display:block;margin-bottom:0.75rem;color:var(--accent);font-family:var(--mono-font);font-size:0.75rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;}
    .partner-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2rem;}
    .partner-contact dl{display:grid;gap:1rem;margin-top:1.25rem;}
    .partner-contact dl div{border-top:1px solid var(--gray-200);padding-top:0.75rem;}
    .partner-contact dt{color:var(--gray-600);font-size:0.8rem;font-weight:600;text-transform:uppercase;}
    .partner-contact dd{color:var(--black);margin-top:0.2rem;}
    .text-link{display:inline-flex;gap:0.5rem;align-items:center;margin-top:1.25rem;color:var(--accent);font-weight:600;text-decoration:none;}
    .text-link:hover{text-decoration:underline;}
    .primary-link{display:inline-flex;gap:0.5rem;align-items:center;margin-top:1.25rem;color:var(--accent);font-weight:600;text-decoration:none;padding:0.7rem 1rem;background:var(--accent);color:var(--white);border-radius:4px;}
    .primary-link:hover{filter:brightness(1.1);text-decoration:none;}
    .footer{text-align:center;margin-top:4rem;padding-top:2rem;border-top:1px solid var(--gray-300);color:var(--gray-600);font-size:0.9rem;}
    @media (max-width:700px){
      .partner-layout,.partner-details{grid-template-columns:1fr;}
      .partner-hero{grid-template-columns:1fr;gap:1.5rem;}
      .partner-hero img{width:140px;height:140px;}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">

        </div>

      <div class="partner-details">
        <div class="project-card partner-contact">
          <span class="section-kicker">Website</span>
          <dl>
            <div><dt>URL</dt><dd><a href="https://www.mcpcba.com/" target="_blank" rel="noopener noreferrer">https://www.mcpcba.com/</a></dd></div>
          </dl>
        </div>
      </div>
    </div>

    <div class="footer">
      <p><a href="/" style="color:var(--accent);text-decoration:none;">Back to Home</a></p>
      <p style="margin-top:1rem;color:var(--gray-600);font-size:0.85rem;">Samrath Singh — Full-Stack Developer | ABN: 72 925 087 373</p>
    </div>
  </div>
</body>
</html>
